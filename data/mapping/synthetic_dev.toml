# Identity mapping for the canonical fixture format written by data/fixtures/generator.py.
# The fixture files already use canonical column names and units, so this config only
# names the files. It deliberately runs through the SAME mapping/validation pipeline as
# the official dataset, so both sources arrive at identical canonical records.

name = "synthetic_dev_canonical_v1"
data_source = "synthetic_dev"
# Fixture timestamps are RFC3339 with "Z"; naive timestamps are rejected.
assume_timezone = ""

[modalities.participants]
files = ["participants.csv"]
columns = { participant_id = "participant_id", display_name = "display_name", timezone = "timezone" }

[modalities.cgm]
files = ["cgm.csv"]
columns = { participant_id = "participant_id", timestamp = "timestamp", glucose_mg_dl = "glucose_mg_dl" }
units = { glucose_mg_dl = "mg/dL" }

[modalities.heart_rate]
files = ["heart_rate.csv"]
columns = { participant_id = "participant_id", timestamp = "timestamp", heart_rate_bpm = "heart_rate_bpm", resting_heart_rate_bpm = "resting_heart_rate_bpm" }

[modalities.meals]
files = ["meals.csv"]
columns = { meal_id = "meal_id", participant_id = "participant_id", timestamp = "timestamp", carbs_g = "carbs_g", protein_g = "protein_g", fat_g = "fat_g", fiber_g = "fiber_g", calories_kcal = "calories_kcal", image_ref = "image_ref" }

[modalities.medications]
files = ["medications.csv"]
columns = { id = "id", participant_id = "participant_id", timestamp = "timestamp", medication_class = "medication_class", dose = "dose", dose_unit = "dose_unit" }

[modalities.activity]
files = ["activity.csv"]
columns = { participant_id = "participant_id", timestamp = "timestamp", activity_value = "activity_value", activity_unit = "activity_unit" }
