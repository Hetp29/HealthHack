# Alembic configuration for the GLIMPSE APPLICATION database (v2).
#
# The database URL is NOT set here. It is read from GLUCOTWIN_APP_DB_URL by
# migrations/env.py, so no credential is ever written to this file.
#
#   alembic upgrade head        # apply all migrations
#   alembic downgrade -1        # roll back the most recent one
#   alembic current             # show the applied revision

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
